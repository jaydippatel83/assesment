services:
  postgres:
    image: postgres:16-alpine
    container_name: benefit-illustration-pg
    environment:
      POSTGRES_USER: bi_app
      # Local development only. Real environments inject this from a secrets manager.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devonly}
      POSTGRES_DB: benefit_illustration
    ports:
      - "5433:5432"
    volumes:
      - bi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bi_app -d benefit_illustration"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  bi-pgdata:
